# The crates live in crates/<name>/: the glob takes each new one, so no change touches this list.
[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MIT"

[workspace.dependencies]
clap = { version = "4.5", features = ["derive"] }
herdr-bus = { path = "crates/herdr-bus" }
herdr-bus-client = { path = "crates/herdr-bus-client" }
jiff = { version = "0.2", features = ["serde"] }
# What `herdr-bus serve` watches the bus file's folder with; herdr-bowtie takes the same.
notify = "8.2"
# herdr-bowtie and herdr-ruminate link SQLite through rusqlite too: two versions of it in one
# build fail to link, so keep this one theirs (README.md, Using it from an app).
rusqlite = { version = "0.38", features = ["bundled"] }
# What the client kills the process group of the command it ran with; herdr-bowtie takes the same.
rustix = { version = "1.1", features = ["process"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.20"
thiserror = "2.0"
# v4 for the bus id, v5 for a producer that derives its ids from its own (SPEC.md, Library API).
uuid = { version = "1.24", features = ["serde", "v4", "v5", "v7"] }

[workspace.lints.rust]
unsafe_code = "forbid"
unreachable_pub = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"
